[project]
name = "gemini-workflow-backend"
version = "0.1.0"
description = "Backend API for the photo-to-video Gemini (Veo) workflow"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<0.1",
  "google-genai>=1.40,<2",
  "eval-type-backport>=0.2,<0.3; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<0.24",
  "respx>=0.21,<0.22",
  "ruff>=0.5,<0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
